<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meu cadastro — Guia Espiritual</title>
<!-- Não indexar: cada endereço destes carrega a chave de um cadastro. -->
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<link rel="icon" type="image/png" href="../favicon.png" />
<meta name="theme-color" content="#150f0c" />
<style>
  :root{ --tinta:#150f0c; --alta:#1e1613; --topo:#261c17; --linha:#3a2a21; --linha-viva:#5a4032;
         --papel:#f3e7d6; --meio:#c4ac92; --baixo:#9f8771; --brasa:#c9713f; --brasa-viva:#e08a53;
         --folha:#6f8f5f; --ouro:#d6a545; }
  *{ box-sizing:border-box }
  body{ margin:0; padding:2.2rem 1rem 3.5rem; background:var(--tinta); color:var(--papel);
        font:15.5px/1.6 Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
        background-image:radial-gradient(52rem 26rem at 50% -6%, rgba(201,113,63,.13), transparent 62%); }
  main{ max-width:36rem; margin:0 auto }
  .marca{ display:block; width:66px; height:auto; margin:0 auto 1.4rem }
  h1{ font:600 26px/1.22 'Iowan Old Style',Palatino,Georgia,serif; margin:0 0 .4rem; text-align:center }
  .sub{ text-align:center; color:var(--meio); margin:0 0 .4rem; font-size:14.5px }
  .ornamento{ display:flex; align-items:center; gap:.6rem; color:var(--linha-viva);
              max-width:12rem; margin:1.4rem auto 1.6rem }
  .ornamento::before,.ornamento::after{ content:''; height:1px; flex:1;
              background:linear-gradient(90deg,transparent,currentColor,transparent) }
  .ornamento i{ width:5px; height:5px; transform:rotate(45deg); border:1px solid currentColor; display:block }

  label{ display:block; margin:1.1rem 0 0 }
  .rot{ display:block; font-size:11px; font-weight:600; letter-spacing:.12em;
        text-transform:uppercase; color:var(--baixo); margin-bottom:.35rem }
  .dica{ display:block; color:var(--baixo); font-size:12.5px; margin-top:.3rem }
  input, textarea, select{ width:100%; font:inherit; font-size:15.5px; color:var(--papel);
    background:var(--alta); border:1px solid var(--linha); border-radius:11px; padding:.7rem .85rem }
  textarea{ min-height:4.4rem; resize:vertical }
  input:focus, textarea:focus, select:focus{ outline:none; border-color:var(--brasa) }

  .acoes{ display:flex; flex-wrap:wrap; gap:.6rem; margin:1.6rem 0 0 }
  button{ flex:1; min-width:12rem; font:inherit; font-size:15px; font-weight:600; cursor:pointer;
          padding:.8rem 1rem; border-radius:12px; border:1px solid var(--linha);
          background:var(--topo); color:var(--papel) }
  button:hover{ background:#31241d; border-color:var(--linha-viva) }
  button.folha{ background:linear-gradient(170deg,var(--folha),#4f6b41); border-color:#4f6b41; color:#f2f7ee }
  button.brasa{ background:linear-gradient(170deg,var(--brasa),#a4562c); border-color:#a4562c; color:#fff7ef }
  button.sair{ flex:none; width:100%; background:transparent; border-color:transparent;
               color:var(--baixo); font-weight:500; font-size:13.5px; margin-top:1.6rem }
  button.sair:hover{ color:#eaa87e; background:transparent }
  button:disabled{ opacity:.5; cursor:progress }

  .recado{ border-radius:13px; padding:1rem 1.15rem; margin:1.3rem 0 0; font-size:14.5px }
  .recado.erro{ background:rgba(201,113,63,.1); border:1px solid rgba(201,113,63,.4); color:#eaa87e }
  .recado.aviso{ background:rgba(214,165,69,.08); border:1px solid rgba(214,165,69,.3); color:#e8c777 }
  .caixa{ background:var(--alta); border:1px solid var(--linha); border-radius:13px;
          padding:1rem 1.15rem; margin:1.3rem 0 0; font-size:14.5px; color:var(--meio) }
  .caixa strong{ color:var(--papel) }
  .fim{ text-align:center; padding:1.5rem 0 }
  .fim .selo{ font-size:44px; line-height:1; color:var(--folha) }
  .fim h2{ font:600 22px/1.3 'Iowan Old Style',Palatino,Georgia,serif; margin:.9rem 0 .5rem }
  .fim p{ color:var(--meio); margin:0 0 .8rem }
  .btn{ display:inline-block; text-decoration:none; padding:.7rem 1.2rem; border-radius:11px;
        border:1px solid var(--linha); background:var(--topo); color:var(--papel);
        font-weight:600; font-size:14.5px; margin:.3rem }
  footer{ margin-top:2.6rem; padding-top:1.2rem; border-top:1px solid var(--linha);
          text-align:center; color:var(--baixo); font-size:12.5px }
  footer a{ color:var(--brasa) }
</style>
</head>
<body>
<main>
  <a href="../"><img class="marca" src="../marca.webp" width="256" height="256" alt="Guia Espiritual" /></a>
  <h1>Meu cadastro</h1>
  <p class="sub" id="linha-sub">Confira os dados do seu espaço no guia.</p>
  <div class="ornamento"><i></i></div>

  <div id="recado"></div>
  <div id="corpo" hidden>
    <form id="form"></form>
    <div class="acoes">
      <button type="button" class="folha" id="btnConfirmar">Está tudo certo</button>
      <button type="button" class="brasa" id="btnSalvar">Salvar correções</button>
    </div>
    <button type="button" class="sair" id="btnSair">Não quero mais aparecer no guia</button>
  </div>

  <footer>
    <p>Esta página é sua. O endereço dela é secreto — quem não tiver o link não vê nem altera nada.
      <br><a href="../sobre/">Como o guia funciona</a> · <a href="../">Ver o guia</a></p>
  </footer>
</main>

<script>
/**
 * Mesmo endereço usado por /cadastrar/ — veja scripts/publico.gs. Vem do
 * dados.json, escrito pela sincronização a partir da variável CADASTRO_URL.
 * Preencher aqui é o atalho para testar sem esperar a sincronia.
 */
let API_PUBLICA = '';

const CANAL = 'https://wa.me/5519974118980';

/* Sem contador aqui: esta página é de uma pessoa só, e o endereço dela é secreto. */

/* Ordem e rótulos dos campos editáveis. `autorizacao` não entra: já foi dada, e
   quem quiser desfazê-la usa o botão de sair. */
const CAMPOS = [
  ['nome',       'Nome do espaço',            'texto'],
  ['dirigente',  'Dirigente ou responsável',  'texto'],
  ['tradicao',   'Vertente espiritual',       'texto'],
  ['cidade',     'Cidade',                    'texto'],
  ['bairro',     'Bairro',                    'texto'],
  ['endereco',   'Endereço completo',         'texto'],
  ['modalidade', 'Como são os atendimentos',  'modalidade'],
  ['telefone',   'Telefone ou WhatsApp',      'texto'],
  ['redes',      'Redes sociais ou site',     'texto'],
  ['horarios',   'Dias e horários',           'longo'],
  ['servicos',   'Serviços e trabalhos',      'longo'],
  ['regras',     'Orientações para quem visita', 'longo'],
  ['tempo',      'Há quanto tempo funciona',  'texto'],
  ['email',      'Seu e-mail (não aparece no guia)', 'texto']
];

const esc = s => (s ?? '').toString()
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const chave = new URLSearchParams(location.search).get('c') || '';
const recado = document.getElementById('recado');
const corpo = document.getElementById('corpo');
const form = document.getElementById('form');

function aviso(texto, tipo){
  recado.innerHTML = `<div class="recado ${tipo || 'erro'}">${texto}</div>`;
}

function pedirAjuda(){
  return `<br><br><a class="btn" href="${CANAL}" rel="nofollow noopener">Falar com quem mantém o guia</a>`;
}

async function chamar(acao, extra){
  const r = await fetch(API_PUBLICA, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ acao, chave, ...extra })
  });
  return r.json();
}

function desenharCampos(dados){
  form.innerHTML = CAMPOS.map(([k, rotulo, tipo]) => {
    const v = esc(dados[k] || '');
    const campo = tipo === 'longo'
      ? `<textarea name="${k}" maxlength="500">${v}</textarea>`
      : tipo === 'modalidade'
        ? `<select name="${k}">${['','Presencial','Online','Ambas'].map(o =>
            `<option value="${o}"${(dados[k]||'') === o ? ' selected' : ''}>${o || 'Prefiro não dizer'}</option>`).join('')}</select>`
        : `<input type="text" name="${k}" maxlength="200" value="${v}" />`;
    return `<label><span class="rot">${rotulo}</span>${campo}</label>`;
  }).join('') +
  `<p class="dica" style="margin-top:1rem">Campo em branco não aparece no guia —
    é assim que você escolhe o que fica público.</p>`;
}

function coletar(){
  const d = Object.fromEntries(new FormData(form).entries());
  return d;
}

function terminou(titulo, texto){
  corpo.hidden = true;
  document.getElementById('linha-sub').hidden = true;
  recado.innerHTML = `<div class="fim">
    <div class="selo">✓</div>
    <h2>${esc(titulo)}</h2>
    <p>${texto}</p>
    <a class="btn" href="../">Ver o guia</a>
  </div>`;
}

async function iniciar(){
  if (!/^https:\/\/script\.google\.com\//.test(API_PUBLICA)){
    try {
      const j = await (await fetch('../dados.json', { cache:'no-store' })).json();
      API_PUBLICA = (j.apiPublica || '').trim();
    } catch (e){ /* sem rede: cai no aviso abaixo */ }
  }
  if (!/^https:\/\/script\.google\.com\//.test(API_PUBLICA)){
    return aviso('Esta página ainda está sendo preparada.' + pedirAjuda(), 'aviso');
  }
  if (!chave){
    return aviso('Este endereço está incompleto. Use o link que você recebeu por mensagem.' + pedirAjuda(), 'aviso');
  }
  try {
    const r = await chamar('ler');
    if (!r.ok){
      return aviso(esc(r.erro || 'Não consegui abrir seu cadastro.') + pedirAjuda(), 'aviso');
    }
    desenharCampos(r.dados);
    corpo.hidden = false;
    document.getElementById('linha-sub').textContent =
      `${r.dados.nome || r.dados.dirigente || 'Seu espaço'} — confira e corrija o que precisar.`;
    if (r.dados.confirmado){
      recado.innerHTML = `<div class="caixa">Você já confirmou estes dados.
        <strong>Pode corrigir de novo sempre que mudar alguma coisa.</strong></div>`;
    }
  } catch (e){
    aviso('Não consegui carregar agora — pode ser a conexão. Tente de novo daqui a pouco.' + pedirAjuda());
  }
}

async function agir(botao, acao, extra, aoDarCerto){
  const todos = corpo.querySelectorAll('button');
  todos.forEach(b => b.disabled = true);
  const texto = botao.textContent;
  botao.textContent = 'Um instante…';
  try {
    const r = await chamar(acao, extra);
    if (r.ok) return aoDarCerto();
    aviso(esc(r.erro || 'Não consegui gravar.') + pedirAjuda());
  } catch (e){
    aviso('Não consegui falar com o servidor — pode ser a conexão.' + pedirAjuda());
  } finally {
    todos.forEach(b => b.disabled = false);
    botao.textContent = texto;
  }
}

document.getElementById('btnConfirmar').addEventListener('click', ev =>
  agir(ev.target, 'confirmar', {}, () => terminou('Obrigado por confirmar',
    'Seu cadastro passa a exibir o selo de confirmado, que quer dizer apenas isto: você conferiu que os dados estão certos.')));

document.getElementById('btnSalvar').addEventListener('click', ev => {
  const dados = coletar();
  if (!dados.nome.trim() && !dados.dirigente.trim()) return aviso('O nome não pode ficar vazio.');
  if ((dados.telefone || '').replace(/\D/g,'').length < 10) return aviso('Informe um telefone com DDD.');
  agir(ev.target, 'salvar', { dados }, () => terminou('Correções salvas',
    'O guia se atualiza na próxima sincronização, em até uma hora. Como você acabou de conferir cada campo, seu cadastro também passa a exibir o selo de confirmado.'));
});

document.getElementById('btnSair').addEventListener('click', ev => {
  if (!confirm('Tem certeza que quer sair do guia?\n\nSeu espaço deixa de aparecer na próxima atualização. Você pode voltar quando quiser, é só se cadastrar de novo.')) return;
  agir(ev.target, 'remover', {}, () => terminou('Pronto, você saiu',
    'Seu espaço deixa de aparecer no guia na próxima atualização, em até uma hora. Se um dia mudar de ideia, a porta continua aberta.'));
});

iniciar();
</script>
</body>
</html>
