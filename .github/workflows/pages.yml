name: Publicar no GitHub Pages

on:
  push:
    # O Pages só aceita publicar a partir da branch principal do repositório.
    # As duas estão listadas para o site continuar publicando caso a principal mude.
    branches: [main, claude/spiritual-spaces-directory-piracicaba-u66nt3]
  workflow_dispatch:
  workflow_call:      # chamado pela sincronização da planilha

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; a mais recente vence.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
