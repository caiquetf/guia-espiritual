name: Sincronizar planilha do formulário

on:
  schedule:
    - cron: '17 * * * *'    # toda hora, aos 17 minutos
  workflow_dispatch:

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      mudou: ${{ steps.commit.outputs.mudou }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Buscar e converter a planilha
        env:
          DIAGNOSTICO: ${{ vars.DIAGNOSTICO }}
          # Planilha de respostas do formulário, publicada na web como CSV.
          # Para trocar sem mexer no código, crie a variável PLANILHA_CSV_URL em
          # Settings → Secrets and variables → Actions → Variables: ela tem prioridade.
          PLANILHA_CSV_URL: ${{ vars.PLANILHA_CSV_URL || 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ-upItrqf1EjRVhql0gBEl3BMZDtQ8eEb5kofeGjcMwrLxpkC-YwwXULNO8CavQSsJgOaMtHoTz-qW/pub?gid=1603923294&single=true&output=csv' }}
          # Link público do formulário de cadastro. Crie a variável FORMULARIO_URL
          # no mesmo lugar; enquanto ela não existir, o botão "Cadastrar meu
          # espaço" simplesmente não é desenhado em nenhuma página.
          FORMULARIO_URL: ${{ vars.FORMULARIO_URL }}
        run: |
          set +e
          node scripts/atualizar-dados.mjs
          code=$?
          set -e
          if [ $code -eq 78 ]; then
            echo "::notice::PLANILHA_CSV_URL ainda não foi configurada — nada a sincronizar."
            exit 0
          fi
          if [ $code -ne 0 ]; then exit $code; fi
          node scripts/gerar-paginas.mjs

      - name: Publicar as mudanças
        id: commit
        run: |
          if [ -n "$(git status --porcelain dados.json espaco sitemap.xml robots.txt)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dados.json espaco sitemap.xml robots.txt
            git commit -m "Atualiza cadastros e páginas a partir da planilha"
            git push
            echo "mudou=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nenhuma mudança nos cadastros."
            echo "mudou=false" >> "$GITHUB_OUTPUT"
          fi

  # Um push feito pelo próprio Actions não dispara outros workflows,
  # por isso a publicação é chamada explicitamente aqui.
  publicar:
    needs: sincronizar
    if: needs.sincronizar.outputs.mudou == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
